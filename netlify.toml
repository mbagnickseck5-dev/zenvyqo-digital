# Déploiement Netlify : Next.js est pris en charge nativement (adaptateur OpenNext),
# aucune extension à installer.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# La racine renvoie vers la version française directement depuis le CDN,
# sans réveiller la fonction Next.js : réponse instantanée pour les liens partagés.
[[redirects]]
  from = "/"
  to = "/fr"
  status = 301
  force = true
