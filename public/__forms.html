<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaires</title></head>
<body>
<!-- Déclaration pour Netlify Forms : les demandes du site sont envoyées ici en arrière-plan (sauvegarde). -->
<form name="demande" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="hidden" name="form-name" value="demande">
  <input name="source"><input name="locale"><input name="plan">
  <input name="fullName"><input name="company"><input name="email"><input name="phone">
  <input name="city"><input name="province"><input name="sector">
  <textarea name="description"></textarea>
  <input name="wantsCall"><input name="website">
</form>
</body>
</html>
